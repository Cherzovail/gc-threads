<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Org/Admin Login - GC Threads</title>
  <link rel="stylesheet" href="../Back/style.css" />
</head>
<body>
  <div id="orgAdminAuthPage" class="page active">
    <div class="container">
      <div class="login-card">
        <!-- Logo -->
        <div class="logo-container">
          <div class="logo-circle">G</div>
          <h1>GC Threads</h1>
          <p class="subtitle">Organization & Admin Portal</p>
        </div>

        <!-- Tab Selector -->
        <div class="auth-tabs">
          <button class="auth-tab-btn active" data-tab="org-login" type="button">Organization Login</button>
          <button class="auth-tab-btn" data-tab="admin-login" type="button">Admin Login</button>
        </div>

        <!-- Organization Login Form -->
        <form id="orgLoginForm" class="auth-tab-content active">
          <h2>Organization Login</h2>
          <div class="form-group">
            <div class="input-wrapper">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22 6 12 13 2 6"/>
              </svg>
              <input type="email" id="orgLoginEmail" placeholder="Organization email" required aria-required="true">
            </div>
          </div>

          <div class="form-group">
            <div class="input-wrapper">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
              <input type="password" id="orgLoginPassword" placeholder="Password" required aria-required="true">
            </div>
          </div>

          <div id="orgLoginError" class="error-message hidden" role="alert"></div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>

          <p class="text-center small-text" style="margin-top: 1rem;">
            New organization? <a href="#" class="link-btn-primary" id="showOrgRegisterBtn" style="border-bottom: 1px solid;">Register here</a>
          </p>
        </form>

        <!-- Organization Registration Form -->
        <form id="orgRegisterForm" class="auth-tab-content hidden">
          <h2>Register Organization</h2>
          <div class="form-group">
            <label for="orgName">Organization Name</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
              </svg>
              <input type="text" id="orgName" placeholder="Organization name" required aria-required="true">
            </div>
          </div>

          <div class="form-group">
            <label for="orgEmail">Organization Email</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22 6 12 13 2 6"/>
              </svg>
              <input type="email" id="orgEmail" placeholder="Organization email" required aria-required="true">
            </div>
          </div>

          <div class="form-group">
            <label for="adminEmail">Admin Email</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="email" id="adminEmail" placeholder="Admin email" required aria-required="true">
            </div>
          </div>

          <div class="form-group">
            <label for="adminPassword">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
              <input type="password" id="adminPassword" placeholder="Password" required aria-required="true">
            </div>
          </div>

          <div id="orgRegisterError" class="error-message hidden" role="alert"></div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Register Organization</button>

          <p class="text-center small-text" style="margin-top: 1rem;">
            Already registered? <a href="#" class="link-btn-primary" id="showOrgLoginBtn" style="border-bottom: 1px solid;">Login here</a>
          </p>
        </form>

        <!-- Admin Login Form -->
        <form id="adminLoginForm" class="auth-tab-content hidden">
          <h2>Admin Login</h2>
          <div class="form-group">
            <div class="input-wrapper">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22 6 12 13 2 6"/>
              </svg>
              <input type="email" id="adminLoginEmail" placeholder="Admin email" required aria-required="true">
            </div>
          </div>

          <div class="form-group">
            <div class="input-wrapper">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
              <input type="password" id="adminLoginPassword" placeholder="Password" required aria-required="true">
            </div>
          </div>

          <div id="adminLoginError" class="error-message hidden" role="alert"></div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Admin Login</button>

          <p class="text-center small-text" style="margin-top: 1rem;">
            Back to <a href="index.html" class="link-btn-primary" style="border-bottom: 1px solid;">student login</a>
          </p>
        </form>

        <!-- Switch to Student Login -->
        <div class="info-box-blue" style="margin-top: 1.5rem;">
          <strong>Student?</strong> Switch to <a href="index.html" class="link-btn-primary" style="display: inline; border-bottom: 1px solid;">student login</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../Back/org-login-page.js"></script>
</body>
</html>
